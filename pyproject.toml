[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "Ingest AI news sources, store articles, and email a daily digest."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.36",
    "youtube-transcript-api>=1.2.0",
]

[project.scripts]
ai-news = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
